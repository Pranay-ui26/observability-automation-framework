[pytest]

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --capture=no
    --html=reports/report.html
    --self-contained-html

markers =
    smoke
    sanity
    regression
    login
    dashboard
    logs
    traces
    metrics
    errors
    rum
    business_events

log_cli = true
log_cli_level = INFO

log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning